    <g><circle cx="300" cy="275" r="18" fill="#76b900"/><text x="300" y="340" text-anchor="middle" font-size="22" font-weight="700">2020</text><text x="300" y="373" text-anchor="middle" font-size="20" fill="#3d4d56">DLSS 2</text><text x="300" y="410" text-anchor="middle" font-size="16" fill="#65747c">通用时域网络</text></g>
    <g><circle cx="485" cy="275" r="18" fill="#76b900"/><text x="485" y="190" text-anchor="middle" font-size="22" font-weight="700">2022</text><text x="485" y="225" text-anchor="middle" font-size="20" fill="#3d4d56">DLSS 3</text><text x="485" y="335" text-anchor="middle" font-size="16" fill="#65747c">Frame Generation</text></g>
    <g><circle cx="665" cy="275" r="18" fill="#76b900"/><text x="665" y="340" text-anchor="middle" font-size="22" font-weight="700">2023</text><text x="665" y="373" text-anchor="middle" font-size="20" fill="#3d4d56">DLSS 3.5</text><text x="665" y="410" text-anchor="middle" font-size="16" fill="#65747c">Ray Reconstruction</text></g>
    <g><circle cx="835" cy="275" r="18" fill="#76b900"/><text x="835" y="190" text-anchor="middle" font-size="22" font-weight="700">2025</text><text x="835" y="225" text-anchor="middle" font-size="20" fill="#3d4d56">DLSS 4</text><text x="835" y="335" text-anchor="middle" font-size="16" fill="#65747c">Transformer + 4× MFG</text></g>
