    <g><circle cx="1110" cy="275" r="25" fill="#101820" stroke="#76b900" stroke-width="6"/><text x="1080" y="160" text-anchor="middle" font-size="22" font-weight="700">2026.09</text><text x="1080" y="195" text-anchor="middle" font-size="20" fill="#3d4d56">DLSS 5</text><text x="1080" y="230" text-anchor="middle" font-size="16" fill="#65747c">生成式神经渲染</text></g>
