<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#76b900"/><stop offset="1" stop-color="#99d32a"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop stop-color="#172733"/><stop offset="1" stop-color="#315064"/></linearGradient></defs>
  <rect width="1200" height="630" rx="26" fill="#eef2f4"/>
  <text x="600" y="65" text-anchor="middle" font-size="36" font-family="Arial,Microsoft YaHei,sans-serif" font-weight="700" fill="#15232c">DLSS 4.5 与 DLSS 5：目标发生变化</text>
  <g font-family="Arial,Microsoft YaHei,sans-serif">
    <rect x="55" y="110" width="510" height="450" rx="24" fill="#fff" stroke="#76b900" stroke-width="4"/>
    <rect x="55" y="110" width="510" height="78" rx="22" fill="url(#g1)"/>
    <rect x="55" y="165" width="510" height="23" fill="url(#g1)"/>
    <text x="310" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#183000">DLSS 4.5</text>
    <text x="310" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#293942">更高效地重建与生成帧</text>
    <text x="95" y="290" font-size="18" fill="#52616a">输入：低分辨率颜色、深度、运动矢量、历史帧、光流</text>
    <line x1="95" y1="320" x2="525" y2="320" stroke="#d8dfe3"/>
    <text x="95" y="365" font-size="19" fill="#33444e">• 第二代 Transformer 超级分辨率</text>
    <text x="95" y="410" font-size="19" fill="#33444e">• 光线重建与 DLAA</text>
    <text x="95" y="455" font-size="19" fill="#33444e">• 动态 1×～6× Multi Frame Generation</text>
    <text x="95" y="500" font-size="19" fill="#33444e">• 输出：清晰高分辨率帧 + 生成帧</text>
    <rect x="635" y="110" width="510" height="450" rx="24" fill="#fff" stroke="#263f50" stroke-width="4"/>
    <rect x="635" y="110" width="510" height="78" rx="22" fill="url(#g2)"/>
    <rect x="635" y="165" width="510" height="23" fill="url(#g2)"/>
    <text x="890" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">DLSS 5</text>
    <text x="890" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#293942">生成最终显示外观</text>
    <text x="675" y="290" font-size="18" fill="#52616a">输入：颜色帧、运动矢量、时间状态、艺术控制值</text>
    <line x1="675" y1="320" x2="1105" y2="320" stroke="#d8dfe3"/>
    <text x="675" y="365" font-size="19" fill="#33444e">• 3D 引导的单步像素空间扩散模型</text>
    <text x="675" y="410" font-size="19" fill="#33444e">• 学习皮肤、头发、布料和光照外观</text>
    <text x="675" y="455" font-size="19" fill="#33444e">• 确定性、因果推理与跨帧稳定</text>
    <text x="675" y="500" font-size="19" fill="#33444e">• 输出：被真实外观先验增强的最终画面</text>
    <rect x="310" y="578" width="580" height="34" rx="17" fill="#dfe6e9"/>
    <text x="600" y="601" text-anchor="middle" font-size="16" fill="#4c5b64">共同点：都不替代游戏引擎与艺术创作，均以原始 3D 场景为基础</text>
  </g>
</svg>

