<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#263746"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76b900"/><stop offset="1" stop-color="#a4db42"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/>
  <text x="60" y="72" fill="#fff" font-size="34" font-family="Arial,Microsoft YaHei,sans-serif" font-weight="700">DLSS 神经渲染流水线</text>
  <text x="60" y="110" fill="#b9c5cf" font-size="19" font-family="Arial,Microsoft YaHei,sans-serif">传统渲染负责可信的场景基础，神经网络负责重建、增强与生成</text>
  <g filter="url(#shadow)" font-family="Arial,Microsoft YaHei,sans-serif">
    <rect x="55" y="170" width="210" height="190" rx="18" fill="#fff"/>
    <text x="160" y="220" text-anchor="middle" font-size="24" font-weight="700" fill="#17232c">游戏引擎</text>
    <text x="160" y="262" text-anchor="middle" font-size="17" fill="#4b5b66">低分辨率颜色</text>
    <text x="160" y="292" text-anchor="middle" font-size="17" fill="#4b5b66">深度 / 运动矢量</text>
    <text x="160" y="322" text-anchor="middle" font-size="17" fill="#4b5b66">光追采样 / UI 数据</text>
    <rect x="355" y="145" width="245" height="240" rx="18" fill="#eaf5d8" stroke="#76b900" stroke-width="3"/>
    <text x="477" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#294200">DLSS 重建</text>
    <text x="477" y="240" text-anchor="middle" font-size="17" fill="#40521f">Super Resolution</text>
    <text x="477" y="271" text-anchor="middle" font-size="17" fill="#40521f">Ray Reconstruction</text>
    <text x="477" y="302" text-anchor="middle" font-size="17" fill="#40521f">DLAA</text>
    <text x="477" y="343" text-anchor="middle" font-size="15" fill="#68803b">时间信息 + Transformer</text>
    <rect x="690" y="145" width="215" height="240" rx="18" fill="#eaf5d8" stroke="#76b900" stroke-width="3"/>
    <text x="797" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#294200">帧生成</text>
    <text x="797" y="242" text-anchor="middle" font-size="17" fill="#40521f">FG / MFG</text>
    <text x="797" y="273" text-anchor="middle" font-size="17" fill="#40521f">光流 + 运动矢量</text>
    <text x="797" y="304" text-anchor="middle" font-size="17" fill="#40521f">1× ～ 6× 动态倍率</text>
    <text x="797" y="343" text-anchor="middle" font-size="15" fill="#68803b">Reflex 控制延迟</text>
    <rect x="995" y="170" width="150" height="190" rx="18" fill="url(#green)"/>
    <text x="1070" y="235" text-anchor="middle" font-size="24" font-weight="700" fill="#132000">显示输出</text>
    <text x="1070" y="278" text-anchor="middle" font-size="18" fill="#223800">高分辨率</text>
    <text x="1070" y="309" text-anchor="middle" font-size="18" fill="#223800">高刷新率</text>
  </g>
  <g fill="none" stroke="#a4db42" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M275 265h58"/><path d="M321 250l15 15-15 15"/>
    <path d="M610 265h58"/><path d="M656 250l15 15-15 15"/>
    <path d="M915 265h58"/><path d="M961 250l15 15-15 15"/>
  </g>
  <text x="60" y="447" fill="#8fa1ae" font-size="16" font-family="Arial,Microsoft YaHei,sans-serif">注：不同 DLSS 版本和显卡支持的组件并不完全相同。</text>
</svg>

